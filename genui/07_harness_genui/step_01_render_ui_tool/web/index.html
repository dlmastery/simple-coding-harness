<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>render_ui - web surface</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; padding: 24px; font: 15px/1.4 system-ui, sans-serif; background: #f6f7fb; color: #1f2335; }
    header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    header h1 { font-size: 18px; margin: 0; color: #3d59a1; }
    header small { color: #565f89; }
    #surface:empty::before { content: "waiting for render_ui..."; color: #565f89; }
    .card { background: #fff; border: 1px solid #d5d9e6; border-radius: 10px; padding: 14px 16px; margin: 8px 0; }
    .card > h2 { margin: 0 0 10px; font-size: 15px; color: #3d59a1; }
    .stack-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .stack-row > * { flex: 1 1 160px; }
    .stack-column { display: flex; flex-direction: column; gap: 8px; }
    .metric { background: #fff; border: 1px solid #d5d9e6; border-radius: 10px; padding: 12px 16px; }
    .metric .label { color: #565f89; font-size: 13px; }
    .metric .value { font-size: 26px; font-weight: 700; color: #3d59a1; }
    .metric .delta { margin-left: 8px; font-size: 13px; color: #9ece6a; }
    .metric .delta.down { color: #e0af68; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #d5d9e6; padding: 6px 10px; text-align: left; }
    th { background: #eef1f8; color: #3d59a1; }
    .chart { background: #fff; border: 1px solid #d5d9e6; border-radius: 10px; padding: 12px 16px; }
    .chart h3 { margin: 0 0 8px; font-size: 14px; color: #e0af68; }
    .bar-row { display: grid; grid-template-columns: 6em 1fr 3em; align-items: center; gap: 8px; margin: 3px 0; }
    .bar { height: 14px; background: #7aa2f7; border-radius: 3px; }
    .bar-row span:last-child { color: #565f89; text-align: right; }
    svg.line { width: 100%; height: 120px; }
  </style>
</head>
<body>
  <header><h1>render_ui - web surface</h1><small id="status">connecting...</small></header>
  <div id="surface"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
