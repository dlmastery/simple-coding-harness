<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>json-render step 1: catalog and Renderer</title>
<!-- No bundler: an import map resolves the bare specifiers the packages use.
     React 19 ships no browser ESM build, so the pinned builds come from esm.sh.
     The versions match package.json, which serves the Node side. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.3",
    "react/jsx-runtime": "https://esm.sh/react@19.2.3/jsx-runtime?external=react",
    "react-dom": "https://esm.sh/react-dom@19.2.3?external=react,scheduler",
    "react-dom/client": "https://esm.sh/react-dom@19.2.3/client?external=react,scheduler",
    "scheduler": "https://esm.sh/scheduler@0.27.0",
    "htm": "https://esm.sh/htm@3.1.1",
    "zod": "https://esm.sh/zod@4.3.6",
    "@json-render/core": "https://esm.sh/@json-render/core@0.20.0?external=zod",
    "@json-render/core/store-utils": "https://esm.sh/@json-render/core@0.20.0/store-utils?external=zod",
    "@json-render/react": "https://esm.sh/@json-render/react@0.20.0?external=react,react/jsx-runtime,zod,@json-render/core,@json-render/core/store-utils",
    "@json-render/react/schema": "https://esm.sh/@json-render/react@0.20.0/schema?external=react,react/jsx-runtime,zod,@json-render/core,@json-render/core/store-utils"
  }
}
</script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1c1e21; }
  .toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  .toolbar input { flex: 1; padding: 8px; font-size: 14px; }
  .toolbar button { padding: 8px 14px; font-size: 14px; }
  .status { color: #666; font-size: 13px; }
  #surface { padding: 16px; max-width: 960px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 14px 16px; margin: 0 0 12px; }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .subtitle { margin: 0 0 10px; color: #666; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; }
  .row > * { flex: 1 1 160px; }
  .gap-small { gap: 8px; }
  .gap-large { gap: 20px; }
  .text { margin: 6px 0; }
  .text.muted { color: #666; }
  .text.strong { font-weight: 600; }
  .metric { background: #f8f9fb; border-radius: 6px; padding: 10px 12px; }
  .metric .label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: .04em; }
  .metric .value { font-size: 24px; font-weight: 600; }
  .metric .delta { font-size: 13px; color: #1a7f37; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 6px 0; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; font-size: 12px; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin: 8px 0; }
  .bar-slot { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .bar { width: 70%; background: #3b6ef5; border-radius: 3px 3px 0 0; min-height: 2px; }
  .line .bar { width: 10px; border-radius: 5px; }
  .bar-label { font-size: 11px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.mjs"></script>
</body>
</html>
