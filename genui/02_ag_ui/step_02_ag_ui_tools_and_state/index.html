<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AG-UI step 02 - tools and state</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1f2933; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  h1 { grid-column: 1 / -1; font-size: 18px; margin: 0; }
  form { grid-column: 1 / -1; display: flex; gap: 8px; }
  input { flex: 1; padding: 8px 10px; border: 1px solid #cbd2d9; border-radius: 6px; font: inherit; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
  button.secondary { background: #9aa5b1; }
  section { background: white; border: 1px solid #e4e7eb; border-radius: 8px; padding: 12px; min-height: 240px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #52606d; margin: 0 0 8px; }
  .message { padding: 8px 10px; border-radius: 6px; margin-bottom: 8px; white-space: pre-wrap; }
  .user { background: #eef2ff; }
  .assistant { background: #f0fdf4; }
  .tool { background: #fff7ed; font: 12px/1.4 ui-monospace, monospace; word-break: break-all; }
  .confirm { background: #fef3c7; border: 1px solid #f59e0b; display: flex; gap: 8px; align-items: center; }
  .confirm span { flex: 1; }
  .metrics { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .metric { flex: 1; min-width: 120px; background: #f8fafc; border: 1px solid #e4e7eb; border-radius: 8px; padding: 10px; }
  .metric-title { font-size: 12px; color: #52606d; }
  .metric-value { font-size: 22px; font-weight: 600; }
  .metric-delta { font-size: 12px; color: #15803d; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 12px; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #e4e7eb; }
  .chart { display: flex; gap: 6px; align-items: flex-end; height: 120px; padding: 4px; border-left: 1px solid #cbd2d9; border-bottom: 1px solid #cbd2d9; }
  .bar-column { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .bar { background: #2563eb; border-radius: 3px 3px 0 0; min-height: 2px; }
  .bar-label { font-size: 11px; text-align: center; color: #52606d; }
  .purchases { margin: 8px 0 0; padding-left: 18px; }
  #wire { font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; color: #3e4c59; margin: 0; max-height: 220px; overflow: auto; }
  #status { grid-column: 1 / -1; color: #52606d; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>AG-UI step 02: tool calls and shared state</h1>
  <form id="ask">
    <input id="prompt" value="Show me a dashboard for a lemonade stand." autocomplete="off">
    <button type="submit">Run</button>
  </form>
  <section><h2>Chat</h2><div id="chat"></div></section>
  <section><h2>Dashboard (rendered from state)</h2><div id="dashboard"></div></section>
  <section style="grid-column: 1 / -1; min-height: 0"><h2>Wire (one event per line)</h2><pre id="wire"></pre></section>
  <div id="status">idle</div>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
