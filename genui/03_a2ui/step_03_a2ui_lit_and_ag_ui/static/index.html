<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A2UI over AG-UI, rendered by @a2ui/lit</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1b1b1f; }
    main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    #prompt-form { display: flex; gap: 8px; margin-bottom: 16px; }
    #prompt-form input { flex: 1; font: inherit; padding: 8px; border: 1px solid #b8bcc4; border-radius: 6px; }
    #prompt-form button { font: inherit; padding: 8px 16px; border-radius: 6px; border: none; background: #1a5fb4; color: #fff; cursor: pointer; }
    /* the surface element and the components inside it carry the catalog's own styles */
    #app { background: #fff; border: 1px solid #d9dbe0; border-radius: 12px; padding: 12px; min-height: 40px; }
    #prose { margin: 12px 0; color: #444; white-space: pre-wrap; }
    #log { margin-top: 16px; font: 12px/1.5 ui-monospace, monospace; color: #444; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>A2UI over AG-UI, rendered by @a2ui/lit</h1>
    <form id="prompt-form">
      <input name="prompt" value="Make a contact form with first name, email, a newsletter checkbox and a send button.">
      <button type="submit">Run agent</button>
    </form>
    <div id="app"></div>
    <div id="prose"></div>
    <div id="log"></div>
  </main>
  <script type="module" src="bundle.js"></script>
</body>
</html>
