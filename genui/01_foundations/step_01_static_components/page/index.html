<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 01 - static components</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 20px; color: #1f2933; background: #f5f7fa; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; padding: 8px 10px; font: inherit; border: 1px solid #cbd2d9; border-radius: 6px; }
  button { padding: 8px 14px; font: inherit; border: 0; border-radius: 6px; background: #2563eb; color: white; }
  #dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card { background: white; border: 1px solid #e4e7eb; border-radius: 8px; padding: 12px; }
  .metric .title { color: #616e7c; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .metric .value { font-size: 28px; font-weight: 600; margin: 4px 0; }
  .metric .delta.up { color: #15803d; }
  .metric .delta.down { color: #b91c1c; }
  .table, .chart { grid-column: span 2; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e4e7eb; }
  th { color: #616e7c; font-weight: 500; font-size: 12px; }
  svg { width: 100%; height: auto; color: #2563eb; }
  svg rect { fill: #2563eb; }
  svg text { font-size: 11px; fill: #616e7c; }
  .unknown { color: #b91c1c; grid-column: span 4; }
  #wire { margin-top: 20px; padding: 12px; font: 12px/1.5 ui-monospace, monospace; background: #1f2933; color: #cbd2d9; border-radius: 8px; white-space: pre-wrap; word-break: break-all; min-height: 3em; }
</style>
</head>
<body>
<form id="form">
  <input id="prompt" value="show me a dashboard for a lemonade stand" autocomplete="off">
  <button id="run" type="submit">Run</button>
</form>
<div id="dashboard"></div>
<pre id="wire"></pre>
<script type="module" src="app.js"></script>
</body>
</html>
