[project]
name = "simple-coding-harness"
version = "0.22.0"
description = "A minimal coding agent, installable as the `harness` command"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
harness = "harness.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
