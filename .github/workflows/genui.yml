name: GenUI course

on:
  push:
    paths:
      - 'genui/**'
      - 'how-did-i-generate-it/genui/**'
      - 'requirements.txt'
      - 'requirements-sdks.txt'
      - 'run_tests.py'
      - 'check_snippets.py'
      - '.github/workflows/genui.yml'
  pull_request:
    paths:
      - 'genui/**'
      - 'how-did-i-generate-it/genui/**'
      - 'requirements.txt'
      - 'requirements-sdks.txt'
      - 'run_tests.py'
      - 'check_snippets.py'
      - '.github/workflows/genui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the documented GenUI dependencies
        run: python -m pip install -r requirements.txt
      - name: Check all GenUI lessons
        run: python run_tests.py genui
      - name: Check lesson snippets
        run: python check_snippets.py genui
      - name: Check course navigation and original backup
        run: python how-did-i-generate-it/genui/check_publication.py
